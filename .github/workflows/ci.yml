name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint, build, test and rebuild the case study
        run: python run_all.py

      - name: The committed report matches the data
        run: git diff --exit-code -- case_study/README.md README.md
